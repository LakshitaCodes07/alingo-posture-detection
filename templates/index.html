<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ALINGO - Body Posture Correcter</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 36px;
        }

        .header p {
            font-size: 18px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .camera-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #camera {
            width: 100%;
            max-width: 800px;
            min-height: 400px;
            background: black;
            border-radius: 10px;
            object-fit: cover;
        }

        .status {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        .good {
            color: green;
        }

        .bad {
            color: red;
        }

        .warning {
            color: #d97706;
        }

        .info {
            color: #374151;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #1f2937;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #111827;
        }

        #confidence {
            margin-top: 10px;
            font-size: 18px;
            color: #4b5563;
        }

        #timer {
            margin-top: 8px;
            font-size: 18px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="header">

        <h1>ALINGO</h1>

        <p>Body Posture Correcter</p>

    </div>


    <div class="container">

        <div class="camera-box">

            <h2>AI Posture Detection</h2>

            <video
                id="camera"
                autoplay
                playsinline>
            </video>

            <br>

            <button onclick="startCamera()">
                Start Camera
            </button>

            <div
                id="status"
                class="status info">

                Camera is waiting...

            </div>

            <div id="confidence"></div>

            <div id="timer"></div>

        </div>

    </div>


    <script>

        const video =
            document.getElementById("camera");

        const statusBox =
            document.getElementById("status");

        const confidenceBox =
            document.getElementById("confidence");

        const timerBox =
            document.getElementById("timer");


        let cameraStarted = false;
        let detectionRunning = false;


        // ----------------------------------------
        // Bad posture timer settings
        // ----------------------------------------

        const BAD_POSTURE_LIMIT = 10;

        let badPostureStartTime = null;


        // ----------------------------------------
        // Recovery settings
        // ----------------------------------------

        const GOOD_RECOVERY_FRAMES = 2;

        let goodRecoveryCounter = 0;

        let stablePosture = "Good Sitting Posture";


        // ----------------------------------------
        // Start camera
        // ----------------------------------------

        async function startCamera() {

            if (cameraStarted) {
                return;
            }

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });

                video.srcObject = stream;

                cameraStarted = true;

                statusBox.className =
                    "status info";

                statusBox.innerText =
                    "Camera started. AI detection is starting...";

                startDetection();

            }

            catch (error) {

                console.error(error);

                statusBox.className =
                    "status bad";

                statusBox.innerText =
                    "Camera could not be started.";

            }

        }


        // ----------------------------------------
        // Capture webcam frame
        // ----------------------------------------

        function createFrame() {

            return new Promise((resolve) => {

                const canvas =
                    document.createElement("canvas");

                canvas.width = 224;
                canvas.height = 224;

                const context =
                    canvas.getContext("2d");

                context.drawImage(
                    video,
                    0,
                    0,
                    224,
                    224
                );

                canvas.toBlob(
                    function(blob) {

                        resolve(blob);

                    },
                    "image/jpeg",
                    0.7
                );

            });

        }


        // ----------------------------------------
        // Send frame to Flask AI
        // ----------------------------------------

        async function sendFrameToAI() {

            if (!cameraStarted) {
                return;
            }

            if (
                video.videoWidth === 0 ||
                video.videoHeight === 0
            ) {
                return;
            }


            try {

                const blob =
                    await createFrame();


                const formData =
                    new FormData();

                formData.append(
                    "image",
                    blob,
                    "frame.jpg"
                );


                const response =
                    await fetch(
                        "/predict",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                if (!response.ok) {

                    statusBox.className =
                        "status bad";

                    statusBox.innerText =
                        "AI server is processing...";

                    console.error(
                        "Server error:",
                        response.status
                    );

                    return;

                }


                const result =
                    await response.json();


                if (result.error) {

                    statusBox.className =
                        "status bad";

                    statusBox.innerText =
                        result.error;

                    return;

                }


                const confidence =
                    (
                        result.confidence * 100
                    ).toFixed(1);


                confidenceBox.innerText =
                    "AI Confidence: " +
                    confidence +
                    "%";


                // --------------------------------
                // BAD POSTURE
                // --------------------------------

                if (
                    result.posture ===
                    "Bad Sitting Posture"
                ) {

                    goodRecoveryCounter = 0;


                    if (
                        badPostureStartTime === null
                    ) {

                        badPostureStartTime =
                            Date.now();

                    }


                    stablePosture =
                        "Bad Sitting Posture";


                    const badDuration =
                        (
                            Date.now() -
                            badPostureStartTime
                        ) / 1000;


                    timerBox.innerText =
                        "Bad posture duration: " +
                        badDuration.toFixed(1) +
                        " seconds";


                    if (
                        badDuration >=
                        BAD_POSTURE_LIMIT
                    ) {

                        statusBox.className =
                            "status warning";

                        statusBox.innerText =
                            "⚠ You are in bad posture for a long time.";

                    }

                    else {

                        statusBox.className =
                            "status bad";

                        statusBox.innerText =
                            "✗ DANGER! You are in Bad Posture.";

                    }

                }


                // --------------------------------
                // GOOD POSTURE
                // --------------------------------

                else {

                    goodRecoveryCounter++;


                    if (
                        goodRecoveryCounter >=
                        GOOD_RECOVERY_FRAMES
                    ) {

                        stablePosture =
                            "Good Sitting Posture";

                        badPostureStartTime =
                            null;

                        goodRecoveryCounter =
                            0;


                        statusBox.className =
                            "status good";

                        statusBox.innerText =
                            "✓ Well Done! You are in Good Posture.";

                        timerBox.innerText =
                            "";

                    }

                }

            }


            catch (error) {

                console.error(
                    "Prediction error:",
                    error
                );

                statusBox.className =
                    "status bad";

                statusBox.innerText =
                    "Waiting for AI prediction...";

            }

        }


        // ----------------------------------------
        // Continuous detection
        // ----------------------------------------

        async function startDetection() {

            if (detectionRunning) {
                return;
            }

            detectionRunning = true;


            while (detectionRunning) {

                await sendFrameToAI();


                // Wait 3 seconds before
                // the next AI prediction.

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            3000
                        )
                );

            }

        }

    </script>

</body>

</html>
